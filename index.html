<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StaffPay">
<meta name="theme-color" content="#0f1923">
<title>StaffPay</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1923; --surface:#19252f; --surface2:#1f2f3a;
  --accent:#f0a500; --accent2:#ff6b35;
  --text:#e8edf0; --muted:#6b8191;
  --green:#2ecc71; --red:#e74c3c; --amber:#f0a500; --blue:#3aa0ff;
  --border:rgba(240,165,0,.15); --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Syne',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
.hide{display:none!important}

/* ---- login ---- */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:34px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px;margin:4px 0 26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:380px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:16px}
input:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0f1923}
.btn:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:18px;text-align:center}
.quick{width:100%;max-width:380px;margin-top:16px}
.quick .qh{color:var(--muted);font-size:12px;text-align:center;margin-bottom:8px}
.quick .row{display:flex;gap:8px}
.quick button{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px 6px;font-size:13px;font-weight:600;cursor:pointer}

/* ---- app ---- */
.header{background:linear-gradient(135deg,#0f1923,#19252f);padding:14px 16px;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.header .logo{font-size:20px}
.header .role{font-size:12px;color:var(--muted)}
.logout{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}

.datebar{display:flex;align-items:center;gap:10px;padding:14px 16px}
.datebar button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer}
.datebar .date{flex:1;text-align:center;font-weight:700;font-size:16px}
.datebar .date small{display:block;color:var(--muted);font-weight:400;font-size:12px}

.tools{padding:0 16px 4px}
.markall{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}

.summary{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap}
.pill{flex:1;min-width:60px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 4px}
.pill b{display:block;font-size:20px}.pill span{font-size:11px;color:var(--muted)}
.pill.p b{color:var(--green)}.pill.a b{color:var(--red)}.pill.h b{color:var(--amber)}.pill.l b{color:var(--blue)}

.group-title{padding:16px 16px 6px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.staff{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:8px 16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.staff .name{font-size:16px;font-weight:600}.staff .meta{font-size:12px;color:var(--muted)}
.marks{display:flex;gap:6px}
.marks button{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:15px;font-weight:700;cursor:pointer}
.marks button.on-P{background:var(--green);color:#08240f;border-color:var(--green)}
.marks button.on-H{background:var(--amber);color:#2a1e00;border-color:var(--amber)}
.marks button.on-A{background:var(--red);color:#2a0b07;border-color:var(--red)}
.marks button.on-L{background:var(--blue);color:#04203f;border-color:var(--blue)}
.legend{text-align:center;color:var(--muted);font-size:12px;padding:16px}
.loading{text-align:center;color:var(--muted);padding:40px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;padding:11px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.toast.show{opacity:1}.toast.ok{background:var(--green);color:#08240f;border-color:var(--green)}.toast.err{background:var(--red);color:#fff;border-color:var(--red)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="logo">Staff<span>Pay</span></div>
  <div class="sub">Attendance · sign in</div>
  <div class="card">
    <label for="email">Login ID</label>
    <input id="email" type="email" autocomplete="username" placeholder="shop@staffpay.local">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="........">
    <button class="btn" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
  <div class="quick">
    <div class="qh">Quick sign-in (demo) —</div>
    <div class="row">
      <button data-e="owner@staffpay.local" data-p="owner1234">Owner</button>
      <button data-e="shop@staffpay.local" data-p="shop1234">Shop head</button>
      <button data-e="workshop@staffpay.local" data-p="work1234">Workshop</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hide">
  <div class="header">
    <div>
      <div class="logo">Staff<span>Pay</span></div>
      <div class="role" id="roleBadge"></div>
    </div>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>

  <div class="datebar">
    <button id="prevDay">&lsaquo;</button>
    <div class="date"><span id="dateMain"></span><small id="dateSub"></small></div>
    <button id="nextDay">&rsaquo;</button>
  </div>

  <div class="tools"><button class="markall" id="markAll">Mark everyone present</button></div>

  <div class="summary">
    <div class="pill p"><b id="cntP">0</b><span>Present</span></div>
    <div class="pill h"><b id="cntH">0</b><span>Half</span></div>
    <div class="pill a"><b id="cntA">0</b><span>Absent</span></div>
    <div class="pill l"><b id="cntL">0</b><span>Leave</span></div>
  </div>

  <div id="staffArea"><div class="loading">Loading...</div></div>
  <div class="legend">P = Present &middot; &frac12; = Half day &middot; A = Absent &middot; L = Leave</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB = "https://enjlgflisuywkaorxetv.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuamxnZmxpc3V5d2thb3J4ZXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5OTU3NjAsImV4cCI6MjA5ODU3MTc2MH0.qKoUBQonv1FYSSrIGfInqXzSWGZHRrGWWHtwgGfL9DQ";

let SESSION = null;           // { access_token, refresh_token, uid, role, location, roleLabel }
let CURRENT_DATE = new Date();
let STAFF = [];
let MARKS = {};

const $ = id => document.getElementById(id);
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function prettyDate(d){ return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let _tt;
function toast(msg,kind){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(kind?' '+kind:''); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),1500); }

// ---- session ----
function saveSession(){ try{ localStorage.setItem('sp_sess', JSON.stringify(SESSION)); }catch(e){} }
function loadSession(){ try{ const s=JSON.parse(localStorage.getItem('sp_sess')||'null'); if(s&&s.access_token){ SESSION=s; return true; } }catch(e){} return false; }
function doLogout(){ SESSION=null; try{localStorage.removeItem('sp_sess');}catch(e){} $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); }

async function refreshSession(){
  if(!SESSION||!SESSION.refresh_token) return false;
  try{
    const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:'POST',headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SESSION.refresh_token})});
    if(!r.ok) return false;
    const d=await r.json();
    SESSION.access_token=d.access_token; SESSION.refresh_token=d.refresh_token; saveSession(); return true;
  }catch(e){ return false; }
}

// ---- REST helper (mirrors NK Warehouse: apikey + Bearer token, auto-refresh on 401) ----
async function api(path, o){
  o = o || {};
  const build = () => Object.assign({ apikey:KEY, Authorization:'Bearer '+(SESSION?SESSION.access_token:KEY), 'Content-Type':'application/json' }, o.headers||{});
  let r = await fetch(SB+path, Object.assign({}, o, {headers: build()}));
  if(r.status===401 && SESSION){ if(await refreshSession()){ r = await fetch(SB+path, Object.assign({}, o, {headers: build()})); } else { doLogout(); throw new Error('Please sign in again.'); } }
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if(!r.ok){ throw new Error((data && (data.message||data.msg)) || ('Error '+r.status)); }
  return data;
}

// ---- auth ----
async function login(email, password){
  const r = await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d = await r.json();
  if(!r.ok){ throw new Error(d.error_description||d.msg||'Login failed'); }
  return d;
}
async function loadRole(){
  const rows = await api('/rest/v1/sp_users?select=*&uid=eq.'+SESSION.uid);
  if(!rows||!rows.length){ throw new Error('This login is not set up in StaffPay.'); }
  SESSION.role=rows[0].role; SESSION.location=rows[0].location; SESSION.roleLabel=rows[0].name||rows[0].role; saveSession();
}

// ---- data ----
async function loadStaff(){
  let path='/rest/v1/sp_staff?select=id,name,location,wage_type&active=eq.true&order=location,name';
  if(SESSION.role!=='owner'){ path+='&location=eq.'+SESSION.location; }
  STAFF = await api(path) || [];
}
async function loadAttendance(){
  const rows = await api('/rest/v1/sp_attendance?select=staff_id,status&day=eq.'+ymd(CURRENT_DATE)) || [];
  MARKS = {}; rows.forEach(r=>{ MARKS[r.staff_id]=r.status; });
}
async function mark(staffId, status){
  const prev = MARKS[staffId]; MARKS[staffId]=status; render();
  try{
    await api('/rest/v1/sp_attendance?on_conflict=staff_id,day',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({staff_id:staffId,day:ymd(CURRENT_DATE),status,marked_by:SESSION.uid})});
    toast('Saved','ok');
  }catch(e){ MARKS[staffId]=prev; render(); toast(e.message,'err'); }
}
async function markAllPresent(){
  const snap=Object.assign({},MARKS); STAFF.forEach(s=>MARKS[s.id]='P'); render();
  const rows = STAFF.map(s=>({staff_id:s.id,day:ymd(CURRENT_DATE),status:'P',marked_by:SESSION.uid}));
  try{
    await api('/rest/v1/sp_attendance?on_conflict=staff_id,day',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
    toast('All present','ok');
  }catch(e){ MARKS=snap; render(); toast(e.message,'err'); }
}

// ---- render ----
function render(){
  $('dateMain').textContent = prettyDate(CURRENT_DATE);
  $('dateSub').textContent = (ymd(CURRENT_DATE)===ymd(new Date())) ? 'Today' : '';
  $('roleBadge').textContent = SESSION.roleLabel + (SESSION.location ? ' · '+SESSION.location : ' · all departments');
  const c={P:0,H:0,A:0,L:0}; STAFF.forEach(s=>{ if(MARKS[s.id]) c[MARKS[s.id]]++; });
  $('cntP').textContent=c.P; $('cntH').textContent=c.H; $('cntA').textContent=c.A; $('cntL').textContent=c.L;
  const area=$('staffArea');
  if(!STAFF.length){ area.innerHTML='<div class="loading">No staff in your area yet.</div>'; return; }
  const groups={}; STAFF.forEach(s=>{ (groups[s.location]=groups[s.location]||[]).push(s); });
  let html='';
  Object.keys(groups).sort().forEach(loc=>{
    html+='<div class="group-title">'+(loc==='workshop'?'Workshop':'Shop')+'</div>';
    groups[loc].forEach(s=>{
      const cur=MARKS[s.id]||'';
      html+='<div class="staff"><div><div class="name">'+esc(s.name)+'</div><div class="meta">'+esc(s.wage_type||'')+'</div></div><div class="marks">'
        +btn(s.id,'P',cur)+btn(s.id,'H',cur,'½')+btn(s.id,'A',cur)+btn(s.id,'L',cur)+'</div></div>';
    });
  });
  area.innerHTML=html;
  area.querySelectorAll('button[data-staff]').forEach(b=>{ b.onclick=()=>mark(b.getAttribute('data-staff'),b.getAttribute('data-st')); });
}
function btn(id,st,cur,label){ return '<button data-staff="'+id+'" data-st="'+st+'" class="'+(cur===st?('on-'+st):'')+'">'+(label||st)+'</button>'; }

// ---- boot ----
async function enterApp(){
  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  $('staffArea').innerHTML='<div class="loading">Loading...</div>';
  try{ await loadStaff(); await loadAttendance(); render(); }
  catch(e){ $('staffArea').innerHTML='<div class="loading">'+esc(e.message)+'</div>'; }
}
async function doLogin(email, password){
  const err=$('loginErr'), b=$('loginBtn');
  err.textContent=''; b.disabled=true; b.textContent='Signing in...';
  try{
    const d=await login(email,password);
    SESSION={ access_token:d.access_token, refresh_token:d.refresh_token, uid:d.user.id };
    await loadRole(); saveSession(); await enterApp();
  }catch(e){ err.textContent=e.message; }
  finally{ b.disabled=false; b.textContent='Sign in'; }
}

$('loginBtn').onclick = ()=> doLogin($('email').value.trim(), $('password').value);
$('password').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });
document.querySelectorAll('.quick button').forEach(b=>{ b.onclick=()=> doLogin(b.getAttribute('data-e'), b.getAttribute('data-p')); });
$('logoutBtn').onclick = doLogout;
$('prevDay').onclick = async ()=>{ CURRENT_DATE.setDate(CURRENT_DATE.getDate()-1); await loadAttendance(); render(); };
$('nextDay').onclick = async ()=>{ CURRENT_DATE.setDate(CURRENT_DATE.getDate()+1); await loadAttendance(); render(); };
$('markAll').onclick = markAllPresent;

(async ()=>{ if(loadSession() && SESSION && SESSION.role){ try{ await enterApp(); }catch(e){ doLogout(); } } })();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
