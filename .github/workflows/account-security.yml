name: Account password checks
on:
  pull_request:
    paths:
      - index.html
      - account-security.js
      - test_account_security*.js
      - .github/workflows/account-security.yml
  push:
    branches:
      - codex/staffpay-password-change-20260915
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_account_security.js
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - run: node test_account_security_browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-form-phone
          path: test-results/
          if-no-files-found: ignore
